name: daily-episode
on:
  schedule:
    - cron: "30 20 * * *"   # 毎日 05:30 JST (UTC 20:30)
  workflow_dispatch:
    inputs:
      date:
        description: "作る日付 (YYYY-MM-DD)。空なら今日"
        required: false
permissions:
  contents: write
concurrency: daily-episode
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pipeline/requirements.txt
      - name: Install ffmpeg and Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - run: pip install -r tools/pipeline/requirements.txt
      - name: Make episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tools/pipeline/run.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
      - name: Commit script (not audio)
        run: |
          git config user.name "monoradio-bot"
          git config user.email "monoradio-bot@users.noreply.github.com"
          git add episodes episodes.json
          git diff --cached --quiet || git commit -m "episode $(date -u +%F)"
          git push
      - name: Publish to gh-pages
        env:
          SHARE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: bash tools/publish.sh
